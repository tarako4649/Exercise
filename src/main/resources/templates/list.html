<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ユーザー一覧</title>
</head>
<body>
    <h1>ユーザー一覧</h1>

    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>名前</th>
                <th>年齢</th>
                <th>詳細</th>
            </tr>
        </thead>

        <tbody>
            <!-- users は Controller から渡される List<User> -->
            <tr th:each="user : ${users}">
                <td th:text="${user.id}"></td>
                <td th:text="${user.name}"></td>
                <td th:text="${user.age}"></td>

                <!-- 詳細ページへのリンク -->
                <td>
                    <a th:href="@{'/users/' + ${user.id}}">詳細</a>
                </td>
            </tr>
        </tbody>
    </table>

    <br>

    <!-- 新規登録ページへのリンク -->
    <a href="/users/new">新規登録</a>
</body>
</html>
